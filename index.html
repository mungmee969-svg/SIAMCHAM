let lang=localStorage.getItem('siamcham_language')||'en',cart=[],activeModal='',regType='buyer',lastRFQ='';const t=(key)=>tr[lang]?.[key]||tr.en[key]||key;const name=(obj)=>obj[lang]||obj.en;const img=(id,w=650)=>id;
function setLanguage(v){lang=v;localStorage.setItem('siamcham_language',v);document.documentElement.lang=v;document.documentElement.dir=v==='ar'?'rtl':'ltr';document.querySelector('#language').value=v;document.querySelectorAll('[data-i]').forEach(el=>el.textContent=t(el.dataset.i));document.querySelectorAll('[data-placeholder]').forEach(el=>el.placeholder=t(el.dataset.placeholder));renderCategories();renderFilters();renderProducts();if(activeModal)openModal(activeModal,regType)}
function renderCategories(){document.querySelector('#categoryGrid').innerHTML=cats.map(c=>`<button class="category" onclick="filterCat('${c.id}')"><div class="photo"><img loading="lazy" src="${img(c.img,550)}" alt="${name(c)}"></div><div class="ct"><strong>${name(c)}</strong><small>Thailand · ${products.filter(p=>p.cat===c.id).length} ${lang==='th'?'รายการตัวอย่าง':'sample products'}</small></div></button>`).join('')}
function renderFilters(){let el=document.querySelector('#filter'),v=el.value||'all';el.innerHTML=`<option value="all">${t('all')}</option>`+cats.map(c=>`<option value="${c.id}">${name(c)}</option>`).join('');el.value=v}
function filterCat(id){document.querySelector('#filter').value=id;renderProducts();document.querySelector('#products').scrollIntoView({behavior:'smooth'})}
function renderProducts(){const q=document.querySelector('#search').value.trim().toLowerCase(),f=document.querySelector('#filter').value||'all';let pp=products.filter(p=>(f==='all'||p.cat===f)&&(!q||[p.en,p.th,p.zh,p.ja,p.ms,p.ar,p.desc].join(' ').toLowerCase().includes(q)));document.querySelector('#productGrid').innerHTML=pp.length?pp.map(p=>`<article class="product"><div class="photo"><img loading="lazy" src="${img(p.img)}" alt="${name(p)}" onerror="this.style.opacity='.08'"><span class="flag">THAILAND · DEMO</span></div><div class="product-body"><span class="meta">${name(cats.find(c=>c.id===p.cat))}</span><h3>${name(p)}</h3><p>${p.desc} · ${t('moq')}: ${p.moq}</p><div class="foot"><button class="btn" onclick="addCart(${p.id})">${t('addRFQ')}</button><button class="btn light details" onclick="productDetail(${p.id})">⌕</button></div></div></article>`).join(''):`<div class="empty">${t('cartEmpty')}</div>`}
function addCart(id){let row=cart.find(a=>a.id===id);if(row)row.qty+=1;else cart.push({id,qty:1});document.querySelector('#cartCount').textContent=cart.length;document.querySelector('.floatcart').animate([{transform:'scale(1)'},{transform:'scale(1.07)'},{transform:'scale(1)'}],{duration:300})}
function openModal(type,who){activeModal=type;if(who)regType=who;document.querySelector('#overlay').classList.add('open');document.body.style.overflow='hidden';document.querySelector('#modalTitle').textContent=t(type==='register'?'registerTitle':type==='cart'?'cartTitle':'moreInfo');if(type==='register')renderRegister();else if(type==='cart')renderCart()}
function closeModal(){document.querySelector('#overlay').classList.remove('open');document.body.style.overflow='';activeModal=''}
function field(label,type='text',req=true){return `<div class="field"><label>${t(label)}${req?' *':''}</label><input type="${type}" ${req?'required':''} placeholder="${t(label)}"></div>`}
function renderRegister(){document.querySelector('#modalBody').innerHTML=`<div class="tabs"><button class="${regType==='buyer'?'active':''}" onclick="regType='buyer';renderRegister()">${t('buyer')}</button><button class="${regType==='supplier'?'active':''}" onclick="regType='supplier';renderRegister()">${t('supplier')}</button></div><form onsubmit="event.preventDefault();alert(t('signupMsg'))"><div class="formgrid">${field('fullname')}${field('email','email')}${field('password','password')}${field('company','text',false)}${field('country')}</div><div class="field"><label>${t('buyerType')}</label><select><option>${regType==='supplier'?t('supplier'):t('retail')}</option><option>${t('wholesaleBuyer')}</option><option>${t('importer')}</option><option>${t('restaurant')}</option></select></div><button class="btn" type="submit">${t('signup')}</button><p class="disclaimer">${t('signupMsg')}</p></form>`}
function renderCart(){document.querySelector('#modalBody').innerHTML=cart.length?`<div>${cart.map(c=>{let p=products.find(p=>p.id===c.id);return `<div class="cart-item"><div><b>${name(p)}</b><div style="color:#72867d;font-size:11px">${p.desc}</div></div><input aria-label="${t('quantity')}" type="number" min="1" value="${c.qty}" onchange="updateQty(${c.id},this.value)"><button class="close" style="font-size:18px;width:32px;height:32px" onclick="removeCart(${c.id})">×</button></div>`}).join('')}</div><form onsubmit="submitRFQ(event)"><div class="formgrid" style="margin-top:20px">${field('contact')}${field('email','email')}${field('country')}</div><div class="field"><label>${t('requirements')}</label><textarea id="requirements"></textarea></div><button class="btn" type="submit">${t('sendRFQ')}</button><p class="disclaimer">${t('signupMsg')}</p></form>`:`<div class="empty">${t('cartEmpty')}<div style="margin-top:16px"><button class="btn" onclick="closeModal();document.querySelector('#products').scrollIntoView({behavior:'smooth'})">${t('continue')}</button></div></div>`}
function updateQty(id,n){let a=cart.find(c=>c.id===id);if(a)a.qty=Math.max(1,Number(n)||1)}function removeCart(id){cart=cart.filter(c=>c.id!==id);document.querySelector('#cartCount').textContent=cart.length;renderCart()}
function submitRFQ(e){e.preventDefault();let inputs=[...e.target.querySelectorAll('input')];lastRFQ=`SIAMCHAM — DEMO RFQ\nContact: ${inputs[0].value}\nEmail: ${inputs[1].value}\nDestination: ${inputs[2].value}\n\n${cart.map(c=>{let p=products.find(p=>p.id===c.id);return `${p.en} — ${c.qty} (unit: ${p.desc})`}).join('\n')}\n\nNotes: ${document.querySelector('#requirements').value}\n\nDEMO ONLY — NOT SUBMITTED`;document.querySelector('#modalBody').innerHTML=`<p>${t('exportMsg')}</p><textarea style="width:100%;height:245px;border:1px solid var(--line);border-radius:12px;padding:13px" readonly>${lastRFQ}</textarea><p><button class="btn" onclick="copyRFQ()">${t('copy')}</button></p>`}
function copyRFQ(){navigator.clipboard?.writeText(lastRFQ).then(()=>alert('Copied')).catch(()=>{let t=document.querySelector('#modalBody textarea');t.select();document.execCommand('copy')})}
function productDetail(id){let p=products.find(x=>x.id===id);openModal('detail');document.querySelector('#modalBody').innerHTML=`<div class="detailgrid"><img src="${img(p.img,850)}" alt="${name(p)}"><div><span class="badge">THAILAND · DEMO</span><h2>${name(p)}</h2><p>${name(cats.find(c=>c.id===p.cat))}</p><p><strong>${t('packing')}:</strong> ${p.desc}<br><strong>${t('moq')}:</strong> ${p.moq}<br><strong>${t('storage')}:</strong> ${p.cat==='frozen'?'Frozen chain confirmation required':p.cat==='fresh'?'Fresh produce logistics confirmation required':'Confirm with supplier'}</p><button class="btn" onclick="addCart(${p.id});openModal('cart')">${t('addRFQ')}</button></div></div><div class="panel" style="margin-top:20px"><h3>${t('video')}</h3><p>${t('videoMsg')}</p><p class="disclaimer">${t('photoMsg')}</p></div>`}
document.querySelector('#overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});setLanguage(lang);
</script></body></html>
